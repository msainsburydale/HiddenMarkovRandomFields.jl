name: Documentation
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
permissions:
  contents: write       # push the built documentation to the gh-pages branch
  pull-requests: read
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # authentication with SSH deploy key
        run: julia --project=docs/ docs/make.jl
